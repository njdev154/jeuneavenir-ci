<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte — JeuneAvenir CI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="alternate icon" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/assistant.css">
</head>
<body class="page-auth">

  <header class="entete-simple">
    <a href="index.html" class="logo"><img src="assets/icons/logo.svg" alt="" class="logo-icone" width="32" height="32">JeuneAvenir CI</a>
    <a href="index.html" class="lien-retour">← Retour à l'accueil</a>
  </header>

  <main class="conteneur-auth">
    <div class="carte carte-auth">
      <h1>Crée ton compte</h1>
      <p class="auth-sous-titre">Démo locale uniquement : le nom et l'e-mail restent dans ce navigateur. Aucun compte en ligne n'est créé; n'utilise pas un mot de passe réel ou réutilisé.</p>

      <form id="formulaire-inscription">

        <fieldset class="choix-type-compte">
          <legend>Je suis un(e) :</legend>

          <label class="carte-type-compte">
            <input type="radio" name="type_compte" value="jeune" checked>
            <span class="type-titre">Jeune</span>
            <span class="type-desc">Lycéen, étudiant ou jeune diplômé</span>
          </label>

          <label class="carte-type-compte">
            <input type="radio" name="type_compte" value="mentor">
            <span class="type-titre">Mentor</span>
            <span class="type-desc">Professionnel souhaitant accompagner</span>
          </label>

          <label class="carte-type-compte">
            <input type="radio" name="type_compte" value="entreprise">
            <span class="type-titre">Entreprise</span>
            <span class="type-desc">Recruteur ou représentant d'entreprise</span>
          </label>
        </fieldset>

        <label for="nom">Nom complet</label>
        <input type="text" id="nom" name="nom" required autocomplete="name">

        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" required minlength="8" autocomplete="new-password">

        <label for="confirmation">Confirmer le mot de passe</label>
        <input type="password" id="confirmation" name="confirmation" required minlength="8" autocomplete="new-password">

        <label class="ligne-case">
          <input type="checkbox" id="conditions" required>
          J'ai lu la <a href="confidentialite.html">notice de confidentialité V1</a> et compris qu'il s'agit d'une démonstration locale.
        </label>

        <p class="message-erreur" id="message-erreur" role="alert"></p>

        <button type="submit" class="bouton-principal bouton-pleine-largeur">Créer mon compte</button>
      </form>

      <div class="separateur">ou continuer avec</div>

      <button class="bouton-social" id="bouton-google">
        <img src="assets/icons/google-logo.svg" alt="" width="18" height="18"> Continuer avec Google
      </button>
      <button class="bouton-social" id="bouton-apple">
        <img src="assets/icons/apple-logo.svg" alt="" width="18" height="18"> Continuer avec Apple
      </button>

      <p class="auth-bas">Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/assistant.js" defer></script>
</body>
</html>
