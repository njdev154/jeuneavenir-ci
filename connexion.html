<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — JeuneAvenir CI</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-auth">

  <header class="entete-simple">
    <a href="index.html" class="logo">🧭 JeuneAvenir CI</a>
    <a href="index.html" class="lien-retour">← Retour à l'accueil</a>
  </header>

  <main class="conteneur-auth">
    <div class="carte carte-auth">
      <h1>Bon retour !</h1>
      <p class="auth-sous-titre">Connecte-toi à ton compte.</p>

      <form id="formulaire-connexion">

        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" required autocomplete="current-password">

        <a href="mot-de-passe-oublie.html" class="lien-mdp-oublie">Mot de passe oublié ?</a>

        <p class="message-erreur" id="message-erreur" role="alert"></p>

        <button type="submit" class="bouton-principal bouton-pleine-largeur">Se connecter</button>
      </form>

      <div class="separateur">ou continuer avec</div>

      <button class="bouton-social" id="bouton-google">
        <span>🔵</span> Continuer avec Google
      </button>
      <button class="bouton-social" id="bouton-apple">
        <span>⚫</span> Continuer avec Apple
      </button>

      <p class="auth-bas">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></p>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
